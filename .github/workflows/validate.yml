name: validate

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_repository.py
      - run: python -m compileall -q tools
      - run: python tools/run.py list
      - run: python tools/run.py doctor
